[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yomimado-ocr"
version = "0.1.0"
description = "Local OCR service boundary for YomiMado"
requires-python = ">=3.9"
dependencies = ["fastapi>=0.115,<1", "python-multipart>=0.0.9,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]
ocr = ["manga-ocr==0.1.16"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
