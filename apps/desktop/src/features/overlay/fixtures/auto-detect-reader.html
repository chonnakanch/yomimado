<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>YomiMado Auto detect synthetic reader</title>
  <style>
    body {
      background: #242830;
      color: white;
      margin: 24px;
      font-family: system-ui;
    }
    button {
      padding: 12px;
      font: inherit;
      margin-right: 8px;
    }
    main {
      width: 640px;
      height: 560px;
      background: white;
      color: black;
      margin: 24px 0;
      border: 4px solid black;
      position: relative;
    }
    .art {
      position: absolute;
      inset: 110px 24px 24px;
      border: 8px solid black;
      background: repeating-linear-gradient(
        30deg,
        #fff 0 30px,
        #252525 30px 60px
      );
    }
    main[data-page="2"] .art {
      background: repeating-linear-gradient(
        140deg,
        #111 0 65px,
        #fff 65px 100px
      );
    }
    main[data-page="3"] .art {
      background: white;
      border: 0;
    }
    .text {
      font: 28px sans-serif;
      padding: 24px;
    }
    main[data-page="3"] .text {
      visibility: hidden;
    }
  </style>
  <h1>Auto detect · synthetic reader</h1>
  <p>
    Select the complete rectangle below, scan it, then enable Auto. Turn pages
    with Left/Right arrow keys or the buttons; keep the pointer still for the
    keyboard check.
  </p>
  <button data-page-target="1">Page 1</button>
  <button data-page-target="2">Page 2</button>
  <button data-page-target="3">Blank page</button>
  <output aria-live="polite" id="page-status">Page 1</output>
  <main data-page="1" aria-label="Synthetic manga area">
    <div class="text" lang="ja">今日はいい天気ですね。</div>
    <div class="art"></div>
  </main>
  <p>Original CSS patterns and Japanese text. No manga assets.</p>
  <script>
    const reader = document.querySelector("main");
    const status = document.getElementById("page-status");
    const texts = [
      "今日はいい天気ですね。",
      "明日は一緒に出かけましょう。",
      "",
    ];
    function showPage(page) {
      reader.dataset.page = String(page);
      reader.querySelector(".text").textContent = texts[page - 1];
      status.textContent = page === 3 ? "Blank page" : `Page ${page}`;
    }
    document.querySelectorAll("[data-page-target]").forEach((button) => {
      button.addEventListener("click", () =>
        showPage(Number(button.dataset.pageTarget)),
      );
    });
    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey)
        return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const direction = event.key === "ArrowRight" ? 1 : -1;
      showPage(
        Math.min(3, Math.max(1, Number(reader.dataset.page) + direction)),
      );
    });
  </script>
</html>
