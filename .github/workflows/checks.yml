name: Checks

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: github.repository == 'chonnakanch/yomimado'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  service:
    if: github.repository == 'chonnakanch/yomimado'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ocr
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: scripts/requirements-ci.txt
      - name: Install the test-only environment (no models or Torch)
        run: |
          python -m pip install --only-binary=:all: -r ../../scripts/requirements-ci.txt
          python -m pip check
          python ../../scripts/prepare_lindera.py --download
      - name: Lint and format service sources
        run: |
          python -m ruff check app tests packaged_main.py windows_packaged_main.py windows_onnx_backend.py
          python -m ruff format --check app tests packaged_main.py windows_packaged_main.py windows_onnx_backend.py
      - name: Test service and model-free OCR regression contracts
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: ../../scripts
        run: |
          python -m pytest -c pyproject.toml -q tests \
            ../../scripts/tests/test_cached_ocr_experiment.py \
            ../../scripts/tests/test_macos_onnx_benchmark.py \
            ../../scripts/tests/test_scan_benchmark_metrics.py \
            ../../scripts/tests/test_translation_component.py \
            --junitxml="$RUNNER_TEMP/service-tests.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "service-tests.xml")
          suites = list(report.iter("testsuite"))
          skipped = sum(int(suite.get("skipped", "0")) for suite in suites)
          tests = sum(int(suite.get("tests", "0")) for suite in suites)
          if skipped or not tests:
              raise SystemExit(f"Service coverage incomplete: {tests} tests, {skipped} skipped")
          print(f"All {tests} service and OCR contract tests ran without skips")
          PY

  release-tools:
    if: github.repository == 'chonnakanch/yomimado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.17"
      - name: Check release version and reviewed runtime compatibility
        run: |
          python scripts/macos-ci-release.py plan
          python scripts/macos-ci-release.py verify-reuse
      - name: Lint and format release scripts
        run: |
          python -m pip install --only-binary=:all: ruff==0.16.8
          python -m ruff check --target-version py311 scripts
          python -m ruff format --check scripts
      - name: Verify workflow syntax using the pinned actionlint binary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/checks.yml .github/workflows/release.yml
      - name: Rehearse strict release gates with local fake APIs
        run: |
          python -m unittest discover -s scripts/tests -p test_desktop_release.py
          python -m unittest discover -s scripts/tests -p test_release_rules.py
          python -m unittest discover -s scripts/tests -p test_update_version.py
      - name: Verify PR previews and complete git-cliff commit audits
        run: |
          python scripts/release_notes.py prepare
          python -m unittest discover -s scripts/tests -p test_release_notes.py
      - name: Verify offline JLPT data and license provenance
        run: python -m unittest discover -s scripts/tests -p test_prepare_jlpt.py

  native:
    if: github.repository == 'chonnakanch/yomimado'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Select the release Rust version
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/desktop/src-tauri/target/
          key: native-${{ runner.os }}-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-1.98.1-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
      - name: Check Rust formatting
        run: cargo +1.98.1 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check
      - name: Lint native code with warnings denied
        run: cargo +1.98.1 clippy --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: Test native capture, coordinate and process code
        run: cargo +1.98.1 test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Compile the desktop debug app
        run: cargo +1.98.1 build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Test the Windows UI smoke driver with synthetic windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          foreach ($file in @('scripts/windows-ui-driver.ps1', 'scripts/verify-windows-ui.ps1', 'scripts/verify-windows-install.ps1', 'scripts/tests/test-windows-ui-driver.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file has PowerShell syntax errors: $errors" }
          }
          & scripts/tests/test-windows-ui-driver.ps1

  # Preserve main's existing required status name. A skipped dependent job can
  # otherwise look successful; explicitly reject every non-success result.
  gates:
    if: ${{ always() && github.repository == 'chonnakanch/yomimado' }}
    needs: [frontend, service, release-tools, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test and native build to succeed
        shell: bash
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SERVICE_RESULT: ${{ needs.service.result }}
          RELEASE_TOOLS_RESULT: ${{ needs.release-tools.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          for result in "$FRONTEND_RESULT" "$SERVICE_RESULT" "$RELEASE_TOOLS_RESULT" "$NATIVE_RESULT"; do
            if [ "$result" != success ]; then
              echo "Required checks did not all pass: frontend=$FRONTEND_RESULT service=$SERVICE_RESULT release-tools=$RELEASE_TOOLS_RESULT native=$NATIVE_RESULT"
              exit 1
            fi
          done
          echo 'All required application, native and release checks passed'

# No job builds installers, accesses private seeds, or publishes. Publication
# retains its separate protected review in release.yml; its concurrency is separate.
