name: Windows GEOS source audit

# Independent source/replacement experiment. Never builds or publishes an installer.
"on":
  push:
    branches: [develop]
    paths:
      - .github/workflows/windows-geos-audit.yml
      - scripts/build-geos-windows.py
      - scripts/geos-windows-probe.py
      - scripts/geos-installed-windows.py
      - scripts/tests/test_geos_windows.py
      - docs/windows-geos-build-inputs.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-geos-source-audit
  cancel-in-progress: false

jobs:
  source-replacement:
    if: github.repository == 'chonnakanch/yomimado' && github.ref == 'refs/heads/develop'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9" # Bootstrap only; probe uses source-built 3.11.17.
          architecture: x64
      - name: Check exact private draft access before rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/geos-installed-windows.py --check-private-draft
          if ($LASTEXITCODE) { throw 'Protected private installer input access required; draft must stay unpublished' }
      - name: Select pinned MSVC and SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC/Auxiliary/Build/vcvarsall.bat'
          $vars = cmd /c "`"$bat`" x64 10.0.26100.0 -vcvars_ver=14.44.35207 >nul && set"
          if ($LASTEXITCODE) { throw 'Pinned MSVC/SDK unavailable' }
          foreach ($line in $vars) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsVersion|VCToolsInstallDir|WindowsSDKVersion|WindowsSdkDir|VSINSTALLDIR)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2])
              "$($Matches[1])=$($Matches[2])" | Add-Content $env:GITHUB_ENV
            }
          }
          if ($env:VCToolsVersion.TrimEnd('\') -ne '14.44.35207' -or $env:WindowsSDKVersion.TrimEnd('\') -ne '10.0.26100.0') { throw 'Native tools differ' }
      - name: Build pinned CPython
        run: |
          python scripts/windows_python.py
          if ($LASTEXITCODE) { throw 'Source CPython build failed' }
      - name: Build GEOS, run CTest and replace frozen probe DLLs
        run: |
          & services/ocr/build/windows/Python-3.11.17/PCbuild/amd64/python.exe scripts/build-geos-windows.py
          if ($LASTEXITCODE) { throw 'GEOS build/replacement failed' }
          'GEOS source CTest and isolated frozen DLL replacement passed. Full installed OCR replacement and source/public-distribution approval remain open.' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content services/ocr/build/windows-geos-audit/replacement-verification.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Verify replacement in exact private installed OCR service
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = 'services/ocr/build/windows-geos-audit/venv/Scripts/python.exe'
          & $python -c "import sys; sys.path.insert(0, 'scripts'); from windows_release import ROOT, read_json, fetch; p = next(p for p in read_json(ROOT / 'services/ocr/windows-inputs.json')['packages'] if p['name'] == 'pillow'); fetch(p, ROOT / 'services/ocr/build/windows-geos-audit/inputs' / p['filename'])"
          if ($LASTEXITCODE) { throw 'Pinned smoke Pillow fetch failed' }
          $pillow = Get-ChildItem services/ocr/build/windows-geos-audit/inputs/pillow-*.whl
          if ($pillow.Count -ne 1) { throw 'Ambiguous smoke Pillow input' }
          & $python -m pip install --no-index --no-deps $pillow.FullName
          if ($LASTEXITCODE) { throw 'Pinned smoke Pillow install failed' }
          & $python scripts/geos-installed-windows.py
          if ($LASTEXITCODE) { throw 'Exact installed OCR replacement failed' }
          'Exact private installed OCR/learning replacement passed; original runner installation restored. Source/public and human installer approval remain open.' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content services/ocr/build/windows-geos-audit/installed-replacement-verification.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Retain textual source/replacement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-geos-source-evidence
          path: |
            services/ocr/build/windows-geos-audit/*.json
            services/ocr/build/windows-geos-audit/*.log
            services/ocr/build/windows-geos-audit/CMakeCache.txt
            services/ocr/build/windows-geos-audit/notices/
            services/ocr/build/windows/python-build.json
            services/ocr/build/windows/python-build.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary installed-test detector
        if: always()
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'yomimado-geos-installed/comictextdetector.pt.onnx') -ErrorAction SilentlyContinue
