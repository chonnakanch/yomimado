name: Windows OpenCV source audit

# Independent source/frozen-runtime experiment. Never builds or publishes an installer.
"on":
  push:
    branches: [develop]
    paths:
      - .github/workflows/windows-opencv-audit.yml
      - scripts/build-opencv-windows.py
      - scripts/opencv-windows-probe.py
      - scripts/tests/test_opencv_windows.py
      - docs/windows-opencv-build-inputs.json
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-opencv-source-audit
  cancel-in-progress: false

jobs:
  source-probe:
    if: github.repository == 'chonnakanch/yomimado' && github.ref == 'refs/heads/develop'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve original source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9" # Bootstrap only; probe uses source-built 3.11.17.
          architecture: x64
      - name: Select pinned MSVC and SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $bat = Join-Path $vs 'VC/Auxiliary/Build/vcvarsall.bat'
          $vars = cmd /c "`"$bat`" x64 10.0.26100.0 -vcvars_ver=14.44.35207 >nul && set"
          if ($LASTEXITCODE) { throw 'Pinned MSVC/SDK unavailable' }
          foreach ($line in $vars) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH|VCToolsVersion|VCToolsInstallDir|WindowsSDKVersion|WindowsSdkDir|VSINSTALLDIR)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2])
              "$($Matches[1])=$($Matches[2])" | Add-Content $env:GITHUB_ENV
            }
          }
          if ($env:VCToolsVersion.TrimEnd('\') -ne '14.44.35207' -or $env:WindowsSDKVersion.TrimEnd('\') -ne '10.0.26100.0') { throw 'Native tools differ' }
      - name: Build pinned CPython
        run: |
          python scripts/windows_python.py
          if ($LASTEXITCODE) { throw 'Source CPython build failed' }
      - name: Obtain temporary smoke-only detector
        run: |
          $ErrorActionPreference = 'Stop'
          $model = Join-Path $env:RUNNER_TEMP 'comictextdetector.pt.onnx'
          Invoke-WebRequest 'https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.2.1/comictextdetector.pt.onnx' -OutFile $model
          if ((Get-FileHash $model -Algorithm SHA256).Hash.ToLower() -ne '1a86ace74961413cbd650002e7bb4dcec4980ffa21b2f19b86933372071d718f') { throw 'Smoke-only model hash differs' }
          "YOMIMADO_OPENCV_DETECTOR=$model" | Add-Content $env:GITHUB_ENV
      - name: Build IPP-free OpenCV and verify native/frozen CPU detector
        run: |
          & services/ocr/build/windows/Python-3.11.17/PCbuild/amd64/python.exe scripts/build-opencv-windows.py $env:YOMIMADO_OPENCV_DETECTOR
          if ($LASTEXITCODE) { throw 'OpenCV source/frozen probe failed' }
          'Source-built OpenCV CPU detector and isolated frozen probe passed. Full installed OCR and source/public-distribution approval remain open.' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content services/ocr/build/windows-opencv-audit/build-verification.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Retain textual source/native/frozen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-opencv-source-evidence
          path: |
            services/ocr/build/windows-opencv-audit/*.json
            services/ocr/build/windows-opencv-audit/*.log
            services/ocr/build/windows-opencv-audit/CMakeCache.txt
            services/ocr/build/windows-opencv-audit/notices/
            services/ocr/build/windows/python-build.json
            services/ocr/build/windows/python-build.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove smoke-only detector
        if: always()
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'comictextdetector.pt.onnx') -ErrorAction SilentlyContinue
