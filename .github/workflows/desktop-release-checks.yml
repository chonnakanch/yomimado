name: Desktop release gate checks

"on":
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    if: github.repository == 'chonnakanch/yomimado'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.17"
      - name: Rehearse strict release gates with local fake APIs
        run: |
          python -m unittest discover -s scripts/tests -p test_desktop_release.py
          python -m unittest discover -s scripts/tests -p test_macos_ci_release.py
          python -m unittest discover -s scripts/tests -p test_desktop_release_recovery.py
        # Fake API commands operate only in temporary directories. This job
        # has no write token, seed access, installer approval or publication step.
