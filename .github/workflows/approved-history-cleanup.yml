name: Approved historical Actions cleanup

# One-time maintainer request, 2026-10-10. Exact 58 run IDs only.
# Remove this workflow after verified completion; no release/content permissions.
"on":
  push:
    branches: [develop]
    paths: [.github/workflows/approved-history-cleanup.yml]
permissions: {}
concurrency:
  group: approved-history-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'chonnakanch/yomimado' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete and verify the exact approved historical runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          expected = {'38040678348': 'dfa7ad289368cec9724e67fc4f153efb5caee4b0', '38031623655': '85d0766354eef528cd3317d1e487f17206836773', '38024770382': '0a7cbe84a40414d91b9d876cd101e3ddf02bba84', '38022182370': '65ac794370fe2b0f60d7ed968ac0be2c04ca4d51', '38021809403': '6be7046c222372ad2b7d3278303444e4a2ecc328', '38020734345': 'd2b52dde989c91cbbbf548a198e7be3d03ec2102', '38020734338': 'd2b52dde989c91cbbbf548a198e7be3d03ec2102', '38020734334': 'd2b52dde989c91cbbbf548a198e7be3d03ec2102', '38019354851': '87731d65c50499a67ec7683e889402638ba557ca', '38017337839': '220bd0bf2d9e4fce616cb8f70b7059e107451a01', '38016752910': '485c672e63befc3f2718cd6dc64decd7b4c8fcca', '38016673211': '902bcf6d3446fbeab65128cfa62ac93f5549a051', '38016054660': '09c4caaea69993cda765efb23dae0d966452f113', '38015437061': '3f2866d8dac6d82cb08f59cc6f8dde8735616ece', '38015229208': 'e47f25dc18162118b9f186c90a4a6ebf1594611f', '37943467439': 'bba93e491f1d6198285917a3cec9bacf3840cd1c', '37941928033': '64ab5de2d18f77c27e324c95ac9c7a5ef84d593f', '37941502143': '572cd7dc5ae376e37ebf38182e8b7cee195c4d93', '37941035678': '9e08202bc782114227612c13ccf14f1996271f37', '37940832130': 'ded468145c562e4843a8d887e56d9b97516d33e9', '37939801320': '61143751c5c79238acfcb57df15c37f9cc8492bc', '37938465690': 'f252ed7d1af767866af54a18a78e08c1b5e31d00', '37938195277': '23ad7f119cf99881aa634855f4394e6b45deac02', '37936508507': '1ea0b33b932b5ef1f8beb7c8e13758cb9b3f699b', '37935912253': '082b241d6b24f127bbfd632b8b37f969e951b039', '37934320710': '3be03080dc59cbd16868da35e51a65b3697a9eb6', '37933246289': '81988bb07121e9bb08c2cdaee4b8ee649a8dc685', '37877467511': 'a10db77ec91d5e1e0f96f444b0a98376c641774a', '37876379469': 'ac10c48f41a8546d0dfe1c09a83bfd875ff81ffa', '37802965979': 'c69eff996f7e85ea88ecb4f0407e05cf5d8ec8b5', '37798943690': '7a8c4d82a9f10461c02ba7e94399c206bf9648a8', '37794271949': '80be890535305c2e3b349fc118561d850a0dfa02', '37787583634': '10b8aba894fe83d08fd7f02fb83771ad68413984', '37782181350': 'f5c157d6f9a4b0e