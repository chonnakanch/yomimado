          repo = 'chonnakanch/yomimado'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/develop'
          assert len(expected) == 58
          base = 'https://api.github.com/repos/' + repo + '/actions/runs/'
          def request(run, method='GET'):
              req = urllib.request.Request(base + run, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, b''
                  raise RuntimeError('GitHub request failed: ' + str(error.code)) from None
          # Validate the entire immutable list before the first irreversible deletion.
          for run, sha in expected.items():
              status, raw = request(run)
              if status == 404:
                  continue
              data = json.loads(raw)
              assert data['head_sha'] == sha and data['status'] == 'completed', run
              assert data['repository']['full_name'] == repo, run
          for run in expected:
              status, _ = request(run, 'DELETE')
              assert status in (204, 404), run
              assert request(run)[0] == 404, 'Deletion not verified: ' + run
              print('Deleted/verified approved run ' + run, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Verified removal of all 58 maintainer-approved historical runs. Private release drafts unchanged.\n')
          PY
